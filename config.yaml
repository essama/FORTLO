    - IT-Leiter
    - CIO
    - Head of Information Technology
    - Head of Applications
    - Leiter Stammdaten
    - Head of Master Data
    - Master Data Manager
    - SAP MDG
    - MDG Lead
    - Head of Data Governance
  title_must_match:
